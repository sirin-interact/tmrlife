# golangci-lint v2 설정이다. server/ 디렉터리에서 `golangci-lint run ./...`로 돌린다.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # 아래에 적은 것만 켠다. 새 버전이 기본 목록을 바꿔도 결과가 흔들리지 않는다.
  default: none
  enable:
    # 버그
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - nilerr
    - durationcheck
    - makezero
    - reassign
    - wastedassign
    - copyloopvar
    - asasalint
    - bidichk
    - gocheckcompilerdirectives
    # 보안
    - gosec
    # 자원 누수
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    # 컨텍스트: 한 턴은 하나의 컨텍스트이고, 취소가 끝까지 전달돼야 한다
    - contextcheck
    - noctx
    - fatcontext
    # 오류 다루기
    - errorlint
    - errname
    # 읽기 좋은 코드
    - revive
    - unconvert
    - usestdlibvars
    - nolintlint
    - testifylint
    # 로그 규칙: 메시지는 고정 문자열이어야 한다 (사용자의 글을 메시지에 이어 붙이지 못하게 한다)
    - sloglint
    # 구조 규칙 (아래 settings 참고)
    - forbidigo
    - depguard
    # misspell은 켜지 않는다. 주석과 테스트 설명이 한국어라 영어 철자 검사가 맞지 않는다.

  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        # 응답을 다 쓴 뒤의 Close 오류는 할 수 있는 일이 없다.
        - (io.Closer).Close
        - (*github.com/jackc/pgx/v5/pgxpool.Pool).Close

    govet:
      enable-all: true
      disable:
        # 구조체 필드는 읽는 순서대로 둔다. 바이트 몇 개를 아끼려고 순서를 뒤섞지 않는다.
        - fieldalignment
        # err를 안쪽 범위에서 다시 선언하는 것은 Go의 흔한 관용구다.
        - shadow

    staticcheck:
      checks:
        - all
        # 주석이 "Package x ...", "Name ..." 꼴의 영어 문장이어야 한다는 검사다.
        # 주석을 한국어로 쓰면 이름 뒤에 조사가 붙어("New는 ...") 항상 걸리므로 끈다.
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
        # 이름 규칙은 revive의 var-naming이 본다.
        - -ST1003
        - -ST1016

    gosec:
      excludes:
        # 돌려받은 오류를 확인하지 않은 경우다. errcheck가 같은 것을 더 정확히 본다.
        - G104

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    revive:
      severity: error
      rules:
        # exported, package-comments는 넣지 않는다. 주석이 영어 문장 꼴인지 보기 때문에 한국어 주석과 맞지 않는다.
        - name: atomic
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: dot-imports
        - name: duplicated-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: identical-branches
        - name: increment-decrement
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: string-of-int
        - name: superfluous-else
        - name: time-naming
        - name: unconditional-recursion
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: use-any
        - name: var-declaration
        - name: var-naming
        - name: waitgroup-by-value

    sloglint:
      no-mixed-args: true
      # 전역 로거를 쓰지 않는다. 로거는 주입받는다.
      no-global: all
      # 컨텍스트가 손에 있으면 컨텍스트를 받는 메서드를 쓴다. 요청 ID 같은 값이 로그까지 이어진다.
      context: scope
      # 메시지는 고정 문자열만 된다. 값은 속성으로 넘기고, 속성은 logging 패키지의 규칙을 거친다.
      static-msg: true
      key-naming-case: snake

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    # 현재 시각은 internal/clock에서만 읽는다.
    # 나머지 코드는 시계를 주입받아야 가짜 시계로 몇 주를 몇 분에 돌려 볼 수 있고,
    # 새벽 경계로 나뉘는 기록 날짜를 시험에서 재현할 수 있다.
    forbidigo:
      # 별칭으로 가져오거나(import t "time") 함수 값으로 넘겨도(now := time.Now) 잡는다.
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          msg: 현재 시각은 internal/clock에서만 읽는다. 시계를 주입받아 쓴다.

    # 계산 코어는 순수 함수다. AI, DB, 시계, 네트워크를 모른다.
    # 같은 기록에서 항상 같은 값이 나와야 하므로 표준 라이브러리와 기록 날짜 패키지만 쓴다.
    depguard:
      rules:
        core-purity:
          list-mode: strict
          files:
            - "**/internal/core/**"
            # 시험 코드는 testify를 쓴다.
            - "!$test"
          allow:
            - $gostd
            - github.com/sirin-interact/tmrlife/server/internal/recorddate
            # core 안의 하위 패키지끼리는 서로 쓸 수 있다.
            - github.com/sirin-interact/tmrlife/server/internal/core

  exclusions:
    # "Code generated ... DO NOT EDIT." 머리말이 있는 파일은 보지 않는다 (sqlc, oapi-codegen).
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - internal/store/db
      - \.gen\.go$
    rules:
      # 시계 패키지와 그 시험만 현재 시각을 읽을 수 있다.
      - path: (^|/)internal/clock/
        linters:
          - forbidigo

      # internal/crypto처럼 표준 라이브러리와 이름이 같은 패키지를 일부러 둔다.
      - linters:
          - revive
        text: conflict with Go standard library

      # 시험 코드에는 느슨하게 적용한다.
      - path: _test\.go$
        linters:
          - gosec
          - noctx
          - contextcheck
          - bodyclose
          - sloglint
          - errname
      - path: (^|/)internal/testdb/
        linters:
          - gosec
          - contextcheck

issues:
  # 같은 문제가 여러 곳에 있어도 줄이지 않고 전부 보여준다.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sirin-interact/tmrlife/server
  exclusions:
    generated: lax
    paths:
      - internal/store/db
      - \.gen\.go$
