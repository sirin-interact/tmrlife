openapi: 3.0.3

info:
  title: 내일 API
  version: 0.3.0
  description: |
    내일 웹앱이 쓰는 REST API다. 모든 경로는 `/api/v1` 아래에 있다.

    ## 인증
    로그인하면 서버가 세션 쿠키를 심는다. 쿠키는 `HttpOnly`라서 스크립트로 읽을 수 없고, 브라우저가 요청마다 알아서 보낸다.
    웹앱은 토큰을 직접 다루지 않는다. 같은 출처에서 부르므로 `fetch`의 기본 동작만으로 쿠키가 실린다.

    ## 다른 출처에서 온 요청
    상태를 바꾸는 요청(POST, PUT, PATCH, DELETE)은 같은 출처의 브라우저 요청이거나 브라우저가 아닌 클라이언트의 요청이어야 한다.
    다른 출처의 페이지가 보낸 요청은 `403 cross_origin_rejected`로 거부한다. 따로 실어 보낼 토큰은 없다.

    ## 가입 여부를 알려주는 응답
    로그인은 이메일이 가입되어 있는지 알려주지 않는다. 없는 계정이든 틀린 비밀번호든 같은 `401 invalid_credentials`이고 걸리는 시간도 같다.
    가입의 `409 email_taken`만은 그 이메일이 이미 가입되어 있다는 사실을 알려준다. 알고서 둔 것이다.
    가입하면 바로 로그인된 상태가 되는데, 메일로 확인하는 절차가 없는 동안에는 두 경우를 같은 응답으로 돌려줄 방법이 없다.
    이 경로로 가입 여부를 확인해 보는 것을 늦추는 것은 주소별 가입 한도(`429 rate_limited`)뿐이다.
    메일 확인이 생기면 가입은 두 경우 모두 같은 응답을 돌려주도록 바뀐다.

    ## 오류
    오류 응답은 모두 `application/problem+json`(RFC 9457)이다. 화면은 `code`를 보고 안내 문구를 고른다.
    `title`은 개발자가 읽는 짧은 영어 문구이고 사용자에게 보여주지 않는다.
    오류 응답은 요청에 담겨 온 값을 되돌려 보내지 않는다.

    | 상태 | code | 뜻 |
    |---|---|---|
    | 400 | `validation_failed` | 요청이 이 명세와 맞지 않는다 (모르는 필드, 틀린 타입, 길이 초과, 깨진 JSON) |
    | 401 | `invalid_credentials` | 이메일이나 비밀번호가 틀렸다. 어느 쪽인지는 알려주지 않는다 |
    | 401 | `unauthenticated` | 로그인하지 않았거나 세션이 끝났다 |
    | 403 | `cross_origin_rejected` | 다른 출처의 페이지가 보낸 요청이다 |
    | 403 | `forbidden` | 로그인은 했지만 할 수 없는 일이다 |
    | 404 | `not_found` | 없는 경로이거나, 그 날짜에 찾는 기록이 없다. 남의 기록도 없는 것과 똑같이 답한다 |
    | 405 | `method_not_allowed` | 그 경로가 받지 않는 메서드다 |
    | 409 | `email_taken` | 이미 가입된 이메일이다 |
    | 413 | `payload_too_large` | 본문이 너무 크다 |
    | 415 | `unsupported_media_type` | 본문이 `application/json`이 아니다 |
    | 422 | `validation_failed` | 값의 꼴은 맞지만 받을 수 없는 값이다. `fields`에 어느 필드인지 담긴다 |
    | 422 | `weak_password` | 비밀번호가 규칙에 맞지 않는다. `reasons`에 이유가 담긴다 |
    | 422 | `consent_required` | 필요한 동의가 빠졌거나 지금 판이 아니다. `consents`에 어느 동의인지 담긴다 |
    | 429 | `rate_limited` | 너무 자주 시도했다. `Retry-After` 헤더의 초만큼 기다린다 |
    | 500 | `internal_error` | 서버 쪽 문제다 |
    | 503 | `service_unavailable` | 지금은 처리할 수 없다. 잠시 뒤에 다시 시도한다 |

    ## 시각
    시각은 모두 UTC이고 `2026-09-20T12:00:00.000Z` 꼴이다(RFC 3339, 밀리초 세 자리 고정).

    ## 기록 날짜
    일기와 하루의 기록은 `2026-09-20` 꼴의 기록 날짜로 찾는다. 기록 날짜는 달력 날짜가 아니다.
    하루는 사용자의 시간대로 새벽 4시에 바뀐다. 새벽 1시에 한 대화는 전날의 기록이다.
    어느 순간이 어느 기록 날짜인지는 서버가 정해서 알려준다. 웹앱이 시각에서 직접 계산하지 않는다.

    ## 캐시
    모든 응답에 `Cache-Control: no-store`가 붙는다. 응답에 개인의 기록이 담기기 때문이다.

    ## 대화 채널 (WebSocket)
    대화는 REST가 아니라 WebSocket으로 주고받는다. 경로는 `/ws/v1/conversation`이다.
    이 명세의 `paths`에는 적을 수 없어서 여기에 글로 적고, 주고받는 메시지의 모양은 `components.schemas`에 둔다.
    클라이언트가 보내는 것은 `WsClientMessage`, 서버가 보내는 것은 `WsServerMessage`다.

    - **인증**: REST와 같은 세션 쿠키다. 같은 출처의 연결에는 브라우저가 알아서 싣는다.
      로그인하지 않았으면 연결을 올리는 요청이 `401 unauthenticated`, 다른 출처의 페이지에서 열었으면 `403 cross_origin_rejected`로 끝난다.
      둘 다 위의 오류 본문과 같은 꼴이다. 다만 브라우저는 실패한 연결의 상태 코드와 본문을 스크립트에 보여주지 않는다.
      연결이 열리지 않으면 `GET /api/v1/me`로 로그인 상태를 확인한다.
    - **메시지**: 텍스트 프레임 하나에 JSON 객체 하나다. `type`으로 종류를 가린다. 모르는 필드는 받지 않는다.
    - **소리**: 바이너리 프레임은 소리다. 방향마다 한 가지뿐이다.
      올라가는 소리는 PCM s16le 16kHz 모노이고, 음성 방식(`ready.mode`가 `voice`)일 때만 받는다. 프레임 하나는 32KiB 이하,
      초당 64,000바이트(실시간의 두 배)까지다. 채팅 방식에서 보내면 `error`(`invalid_message`)다.
      내려가는 소리는 PCM s16le 24kHz 모노다. `audio_start`와 `audio_end` 사이의 바이너리 프레임이 그 말의 소리다.
    - **음성 방식**: `start`에서 `voice`를 요청했는데 서버가 음성을 쓸 수 없으면 `error`(`voice_unavailable`)를 보내고 `chat`으로 연다.
      실제 방식은 `ready.mode`에 있다. 대화 중에는 `set_mode`로 바꾸고 서버가 `mode`로 답한다. 어느 방식이든 같은 대화가 이어진다.
      음성 방식에서 알아들은 말은 `transcript`로 온다. 중간 결과(`final: false`)는 자막용이고, 끝점이 오면 `final: true`에
      `client_message_id`가 붙고 그 글로 턴이 돈다(`thinking` → `ai_text`). 글로 쓴 `user_text`도 그대로 받는다.
    - **한도**: 메시지 하나의 크기와 보내는 빈도에 한도가 있다. 넘으면 `error`(`message_too_large`, `rate_limited`)가 온다.
    - **닫힘 코드**: 서버가 연결을 닫을 때 쓰는 값이다. 1000~2999는 표준이 정한 값이라 쓰지 않고 앱이 쓸 수 있는 4000번대를 쓴다.
      `4001`은 같은 계정의 다른 연결이 대화를 이어받았다는 뜻이고, `4002`는 계정이 지워져 더 이어갈 수 없다는 뜻이다.
      이 둘은 다시 이어도 같은 까닭으로 닫히므로 클라이언트가 다시 잇지 않는다. 그 밖의 닫힘은 일시적인 것으로 보고 다시 잇는다.

    | 방향 | type | 뜻 |
    |---|---|---|
    | 클라이언트 → 서버 | `start` | 대화를 시작한다. 열린 대화가 있으면 그 대화를 이어간다 |
    | 클라이언트 → 서버 | `user_text` | 사용자가 쓴 글 |
    | 클라이언트 → 서버 | `end` | 끝내기 버튼을 눌렀다 |
    | 서버 → 클라이언트 | `ready` | `start`의 답. 대화 식별자, 기록 날짜, 이어가는 대화라면 지난 발화 |
    | 서버 → 클라이언트 | `thinking` | 글을 받아 저장했고 답을 준비하고 있다 |
    | 서버 → 클라이언트 | `ai_text` | AI의 말 |
    | 서버 → 클라이언트 | `resources` | 화면에 고정해 둘 도움 자원 |
    | 서버 → 클라이언트 | `ended` | 대화가 끝났다 |
    | 서버 → 클라이언트 | `diary_ready` | 일기 초안이 준비됐다 |
    | 서버 → 클라이언트 | `error` | 요청을 처리하지 못했다 |

    흐름은 이렇다.

    1. 연결하고 `start`를 보낸다. 서버는 `ready`로 답한다.
       새 대화면 곧이어 첫 안부가 `ai_text`로 온다. 이어가는 대화면 `ready.utterances`에 지난 발화가 담겨 오고,
       `ready.resources_pinned`가 참이면 곧이어 `resources`가 온다.
    2. 글을 `user_text`로 보낸다. 서버는 저장한 뒤 `thinking`으로 받았음을 알리고, 답이 준비되면 `ai_text`를 보낸다.
       답은 한 번에 통째로 온다. 조각으로 나눠 보내지 않는다.
       `thinking`이 오지 않았으면 같은 `client_message_id`로 다시 보낸다. 몇 번을 보내도 글은 한 번만 저장된다.
    3. 서버가 `resources`를 보내면 그 목록을 대화가 끝날 때까지 화면에 고정해 둔다. 전화번호는 누르면 바로 걸리게 한다.
    4. 3분쯤 말이 없으면 서버가 `ai_text`로 한 번 묻고, 그래도 말이 없으면 `ended`(`reason: idle`)를 보낸다.
    5. 끝내기 버튼은 `end`를 보낸다. 서버는 `ended`로 답한다. `ended.diary_expected`가 참이면 일기 초안을 만들고 있다는 뜻이고,
       준비되면 `diary_ready`가 온다. 그 뒤에 `GET /api/v1/diaries/{date}`로 초안을 읽는다.
       연결이 먼저 끊겼다면 `diary_ready`는 오지 않는다. 그때는 일기를 읽어 보고 없으면 잠시 뒤에 다시 읽는다.
    6. 연결이 끊겨도 대화는 한동안 열려 있다. 다시 연결해 `start`를 보내면 같은 대화를 이어간다.

    서버는 글을 어떻게 판단했는지를 보내지 않는다. 화면이 알아야 하는 것은 나가는 말과 도움 자원뿐이다.
    `error`에는 사용자가 쓴 글을 되돌려 보내지 않는다.

tags:
  - name: auth
    description: 가입, 로그인, 로그아웃
  - name: me
    description: 로그인한 사용자 자신
  - name: diaries
    description: 일기장. 날짜별 열람, 검색, 수정, 하루 삭제
  - name: signals
    description: 마음 신호. 변화 추세, 하루의 근거, 신호 취소
  - name: internal
    description: 내부 확인용. 시연 계정과 관리자만 열린다
  - name: resources
    description: 도움이 필요할 때 연락할 수 있는 곳

# 따로 적지 않은 경로는 로그인이 필요하다. 로그인 없이 부르는 경로만 `security: []`로 풀어 준다.
# 새 경로를 더하면서 깜빡해도 열려 있는 쪽이 아니라 잠겨 있는 쪽으로 틀린다.
security:
  - sessionCookie: []

paths:
  /api/v1/auth/requirements:
    get:
      operationId: getAuthRequirements
      tags: [auth]
      summary: 가입 화면이 알아야 하는 규칙
      description: |
        비밀번호 규칙과, 가입할 때 받아야 하는 동의의 종류와 지금 판을 돌려준다.
        가입 화면은 이 값을 코드에 박아 두지 않고 여기서 받아서 보여주고, 받은 `consents`를 가입 요청에 그대로 실어 보낸다.
      security: []
      responses:
        "200":
          description: 가입 규칙
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRequirements"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: 가입
      description: |
        계정을 만들고 바로 로그인된 상태로 만든다. 응답에 세션 쿠키가 실린다.
        요청에 세션 쿠키가 딸려 왔으면 그 세션은 끊긴다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입했고 로그인됐다
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "409":
          description: 이미 가입된 이메일이다 (`email_taken`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            받을 수 없는 값이다.
            `weak_password`(`reasons`), `consent_required`(`consents`), `validation_failed`(`fields`) 가운데 하나다.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인
      description: |
        이메일과 비밀번호를 확인하고 새 세션을 연다. 응답에 세션 쿠키가 실린다.
        요청에 세션 쿠키가 딸려 왔으면 그 세션은 끊기고 새 토큰으로 바뀐다.
        실패의 까닭(없는 이메일, 틀린 비밀번호)은 구분해서 알려주지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인됐다
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 이메일이나 비밀번호가 틀렸다 (`invalid_credentials`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃
      description: |
        지금 세션을 끊고 쿠키를 지운다. 몇 번을 불러도 결과가 같다. 세션이 없거나 이미 끝났어도 204다.
      security: []
      responses:
        "204":
          description: 로그아웃됐다. 쿠키를 지우는 `Set-Cookie`가 실린다
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearedSessionCookie"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: 로그인한 사용자와 설정
      description: |
        앱을 열 때 로그인 상태인지 알아보는 데에도 쓴다. 401이면 로그인 화면으로 보낸다.
        세션이 끝났으면 401과 함께 쿠키를 지우는 `Set-Cookie`가 실린다.
      responses:
        "200":
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/diaries:
    get:
      operationId: listDiaries
      tags: [diaries]
      summary: 한 달의 일기 목록, 또는 검색
      description: |
        `month`와 `q` 가운데 하나만 준다. 둘 다 주거나 둘 다 주지 않으면 `400 validation_failed`다.

        - `month`를 주면 그 달의 일기를 날짜순으로 돌려준다. 일기가 없는 날은 목록에 없다.
        - `q`를 주면 본인의 모든 일기에서 그 글자가 들어 있는 것을 최근 날짜부터 돌려준다.
          영문은 대소문자를 가리지 않는다. 앞뒤 공백은 떼고 찾는다. 공백만 있는 검색어는 `422 validation_failed`(`fields: [q]`)다.
          아직 확인하지 않은 초안도 찾는다.

        목록의 `first_line`은 지금 화면에 보일 글의 첫 줄이다. 상태가 `draft`면 초안의, `confirmed`면 확인한 글의 첫 줄이다.
      parameters:
        - name: month
          in: query
          description: 보고 싶은 달. `YYYY-MM` 꼴이다
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          example: "2026-09"
        - name: q
          in: query
          description: 검색어
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: 일기 목록. 맞는 것이 없으면 빈 목록이다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/diaries/{date}:
    parameters:
      - $ref: "#/components/parameters/RecordDate"
    get:
      operationId: getDiary
      tags: [diaries]
      summary: 하루의 일기
      description: |
        그날의 일기를 돌려준다. 상태가 `draft`면 `text`는 대화에서 만든 초안이고, `confirmed`면 사용자가 확인한 글이다.
        확인한 뒤에 그날 다시 대화하면 새 대화의 내용을 이어 붙인 초안이 생기고 상태가 `draft`로 돌아간다. 사용자가 다시 확인한다.

        그날의 일기가 없으면 `404 not_found`다. 대화가 막 끝나 초안을 만드는 중일 때도, 초안을 자동으로 만들지 않은 날도 그렇다.
      responses:
        "200":
          description: 그날의 일기
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putDiary
      tags: [diaries]
      summary: 일기를 고치고 확인한다
      description: |
        보낸 글이 그날의 일기가 되고 상태가 `confirmed`가 된다. 초안을 고치지 않고 그대로 확인할 때도 그 글을 그대로 보낸다.
        바뀌는 것은 일기 글뿐이다. 대화에서 나온 마음 신호는 바뀌지 않는다.

        그날의 일기가 아직 없어도 대화한 날이면 새로 만든다. 초안을 자동으로 만들지 않은 날에도 사용자는 일기를 직접 쓸 수 있다.
        대화하지 않은 날이면 `404 not_found`다.

        글의 앞뒤 공백은 떼고 저장한다. 공백만 있는 글은 `422 validation_failed`(`fields: [text]`)다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryUpdate"
      responses:
        "200":
          description: 확인한 일기
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/days/{date}:
    parameters:
      - $ref: "#/components/parameters/RecordDate"
    delete:
      operationId: deleteDay
      tags: [diaries]
      summary: 하루를 지운다
      description: |
        그날의 일기만이 아니라 그날의 대화, 발화, 마음 신호와 그 근거, 그날에서 나온 기억까지 함께 지운다.
        지운 것은 되돌릴 수 없다. 추세는 남은 기록으로 다시 계산된다.
        화면은 무엇이 함께 지워지는지 알리고 한 번 더 확인받은 뒤에 이 요청을 보낸다.

        그날에 열려 있는 대화가 있으면 그 대화도 함께 지워진다.
        그날의 기록이 없으면 `404 not_found`다. 이미 지운 날을 다시 지우려 해도 그렇다.
      responses:
        "204":
          description: 지웠다
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/trend:
    get:
      operationId: getTrend
      tags: [signals]
      summary: 최근 2주의 변화 추세
      description: |
        추세 화면이 그대로 그릴 수 있는 점 달력이다. 줄은 기분, 수면, 에너지 셋이고 칸은 창 안의 날짜마다 하나다.
        화면은 이 응답으로 셈을 하지 않는다. 일수와 비교 결과는 모두 서버가 계산해서 보낸다.
        같은 기록을 화면이 따로 세면 화면에 보이는 숫자와 서버가 판단에 쓴 숫자가 어긋날 수 있다.

        `as_of`가 이 값을 계산한 기준일이다. 대화가 진행 중인 오늘은 신호가 아직 없을 수 있어서,
        오늘의 기록이 없으면 어제를 기준일로 삼는다. 오늘 한 대화는 분석이 끝난 뒤에 이 화면에 나타난다.

        점수와 개입 단계는 여기에 담지 않는다. 사용자 화면에는 그 숫자를 보여주지 않는다.
      responses:
        "200":
          description: 점 달력. 기록이 하나도 없어도 빈 칸으로 채운 달력이 온다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trend"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/days/{date}/signals:
    parameters:
      - $ref: "#/components/parameters/RecordDate"
    get:
      operationId: getDaySignals
      tags: [signals]
      summary: 하루의 마음 신호와 그 근거
      description: |
        그날 여덟 항목을 어떻게 보았는지와, 그렇게 본 근거가 된 사용자의 말이다.

        `analysed`가 거짓이면 그날은 아직 분석이 끝나지 않았거나 대화하지 않은 날이고 `items`는 비어 있다.
        대화가 막 끝나 분석이 도는 중일 때도 그렇다. 참이면 `items`는 언급이 없었던 항목까지 여덟 개다.

        하루에 대화를 여러 번 했으면 항목마다 `rows`가 여러 개다. `status`와 `explicitness`는 그날 그 항목의
        판단으로, 취소한 행을 뺀 뒤에 합친 값이다. 취소한 행도 `rows`에는 남아 `cancelled`가 참으로 온다.
      responses:
        "200":
          description: 그날의 신호와 근거
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaySignals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/signals/{signalId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SignalID"
    post:
      operationId: cancelSignal
      tags: [signals]
      summary: 이 신호는 아니라고 표시한다
      description: |
        그 판단을 계산에서 뺀다. 행은 지우지 않는다. 추출이 그 사람의 표현을 과하게 읽고 있지 않은지 돌아보는 데 쓴다.
        추세와 추정은 남은 기록으로 다시 계산된다.

        같은 버튼을 두 번 눌러도 결과가 같다. 이미 취소한 신호에 다시 불러도 200이다.
        응답은 그 신호가 속한 하루의 신호 전부다. 항목의 합친 판단이 함께 바뀌므로 화면이 다시 읽지 않아도 된다.
        없는 신호이거나 남의 신호면 `404 not_found`다.
      responses:
        "200":
          description: 취소한 뒤 그날의 신호와 근거
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaySignals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/signals/{signalId}/uncancel:
    parameters:
      - $ref: "#/components/parameters/SignalID"
    post:
      operationId: uncancelSignal
      tags: [signals]
      summary: 취소를 되돌린다
      description: |
        취소한 신호를 다시 계산에 넣는다. 취소한 적이 없는 신호에 불러도 200이다.
        응답과 오류는 취소와 같다.
      responses:
        "200":
          description: 되돌린 뒤 그날의 신호와 근거
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaySignals"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/internal/review:
    get:
      operationId: getInternalReview
      tags: [internal]
      summary: 계산이 그 값에 이른 과정 전부
      description: |
        추정 점수, 신뢰도, 개인 기준선, 변화 탐지, 개입 단계를 중간값까지 그대로 돌려준다.
        만드는 사람과 심사하는 사람이 "왜 이 값인가"를 눈으로 따라갈 수 있게 두는 화면이다.

        **시연 계정(`is_demo`)이나 관리자 계정이 아니면 `403 forbidden`이다.**
        추정 점수와 개입 단계는 사용자에게 숫자로 보여주지 않는다. 힘든 사람에게 점수와 경고는 도움보다 상처가 되기 쉽고,
        이 값은 정식 자가 점검의 결과가 아니라 대화 기록에서 추정한 값이기 때문이다.

        `as_of`가 기준일이다. 추세와 같은 규칙으로 고른다. `params`는 이 계산에 쓴 조정 값이라,
        누적값 옆에 한계값을 그리는 것처럼 결과를 읽는 데 필요한 경계를 함께 볼 수 있다.
      responses:
        "200":
          description: 기준일 하루의 평가 전부
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalReview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: 시연 계정도 관리자도 아니다 (`forbidden`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: 도움이 필요할 때 연락할 수 있는 곳
      description: |
        언제든 열 수 있는 "도움이 필요할 때" 화면이 보여주는 목록이다. 로그인하지 않아도 열린다.
        급한 곳이 앞에 온다. 전화번호는 누르면 바로 걸리게 한다(`tel:`).
        대화 도중에 서버가 보내는 `resources` 메시지도 같은 모양이다.
      security: []
      responses:
        "200":
          description: 도움 자원 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: naeil_session
      description: |
        로그인과 가입 응답이 심는 세션 쿠키다. 이름은 배포 설정을 따른다.
        HTTPS로만 보내는 설정(운영)에서는 이름 앞에 `__Host-`가 붙는다.

  parameters:
    RecordDate:
      name: date
      in: path
      required: true
      description: 기록 날짜. `YYYY-MM-DD` 꼴이다
      schema:
        $ref: "#/components/schemas/RecordDate"
    SignalID:
      name: signalId
      in: path
      required: true
      description: 신호 판단 하나를 가리키는 ID. 하루의 신호 목록에서 온다
      schema:
        type: string
        format: uuid

  headers:
    SessionCookie:
      description: |
        세션 쿠키. `HttpOnly; SameSite=Lax; Path=/`이고, 운영에서는 `Secure`가 더 붙는다.
        `Max-Age`는 세션의 전체 수명이다.
      required: true
      schema:
        type: string
    ClearedSessionCookie:
      description: 세션 쿠키를 지운다(`Max-Age=0`).
      required: true
      schema:
        type: string

  responses:
    Problem:
      description: 그 밖의 오류. 본문의 `code`로 구분한다
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: 요청이 이 명세와 맞지 않는다 (`validation_failed`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: 로그인하지 않았거나 세션이 끝났다 (`unauthenticated`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CrossOriginRejected:
      description: 다른 출처의 페이지가 보낸 요청이다 (`cross_origin_rejected`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 그 날짜에 찾는 기록이 없다 (`not_found`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: 값의 꼴은 맞지만 받을 수 없는 값이다 (`validation_failed`). `fields`에 어느 필드인지 담긴다
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: 너무 자주 시도했다 (`rate_limited`)
      headers:
        Retry-After:
          description: 다시 시도하기까지 기다릴 초
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Timestamp:
      type: string
      format: date-time
      description: UTC 시각. 밀리초 세 자리까지 고정된 꼴이다
      example: "2026-09-20T12:00:00.000Z"
      # 손으로 쓴 타입이다. 어느 시각이든 같은 꼴로 내보낸다.
      x-go-type: UTCTime

    ConsentKind:
      type: string
      description: |
        동의의 종류.
        `terms` 이용약관, `privacy` 개인정보 처리방침, `sensitive_data` 마음에 관한 기록의 처리,
        `overseas_transfer` 대화 내용이 외부 AI 서비스로 전송되어 해외에서 처리되는 것.
      enum: [terms, privacy, sensitive_data, overseas_transfer]

    ConsentGrant:
      type: object
      additionalProperties: false
      required: [kind, version]
      properties:
        kind:
          $ref: "#/components/schemas/ConsentKind"
        version:
          type: string
          description: 사용자가 보고 동의한 문서의 판
          minLength: 1
          maxLength: 32
          example: "2026-09-20"

    PasswordRequirements:
      type: object
      required: [min_length, max_bytes]
      properties:
        min_length:
          type: integer
          description: 최소 길이. 글자 수로 센다
          example: 10
        max_bytes:
          type: integer
          description: 최대 길이. UTF-8 바이트로 센다(한글 한 글자는 3바이트)
          example: 128

    AuthRequirements:
      type: object
      required: [password, consents, display_name_max_length]
      properties:
        password:
          $ref: "#/components/schemas/PasswordRequirements"
        consents:
          type: array
          description: 가입에 필요한 동의와 그 지금 판. 모두 필수다
          items:
            $ref: "#/components/schemas/ConsentGrant"
        display_name_max_length:
          type: integer
          description: 부를 이름의 최대 글자 수
          example: 40

    SignupRequest:
      type: object
      additionalProperties: false
      required: [email, password, consents]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          # 규칙의 한도보다 넉넉하다. 규칙을 넘는 비밀번호는 422 weak_password로 이유와 함께 알려준다.
          maxLength: 1024
        display_name:
          type: string
          description: 부를 이름. 비워 둘 수 있다. 앞뒤 공백을 떼고 40자까지 받는다
          maxLength: 80
        timezone:
          type: string
          description: |
            IANA 시간대 이름(예: `Asia/Seoul`). 브라우저의 `Intl.DateTimeFormat().resolvedOptions().timeZone` 값을 보낸다.
            하루의 경계와 알림 시각이 이 값으로 계산된다. 보내지 않으면 `Asia/Seoul`이다.
          maxLength: 64
        consents:
          type: array
          description: "`GET /api/v1/auth/requirements`가 준 동의 목록 가운데 사용자가 동의한 것"
          maxItems: 16
          items:
            $ref: "#/components/schemas/ConsentGrant"

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024

    User:
      type: object
      required: [id, email, display_name, timezone, is_demo, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
          nullable: true
          description: 부를 이름. 정하지 않았으면 null이다
        timezone:
          type: string
          description: IANA 시간대 이름
          example: Asia/Seoul
        is_demo:
          type: boolean
          description: 둘러보기용으로 만들어진 계정인지
        created_at:
          $ref: "#/components/schemas/Timestamp"

    ConversationMode:
      type: string
      description: 대화를 시작할 때의 기본 방식
      enum: [voice, chat]

    SettingsSummary:
      type: object
      required:
        - reminder_enabled
        - reminder_time
        - default_mode
        - analysis_enabled
        - memory_enabled
        - mood_pick_enabled
      properties:
        reminder_enabled:
          type: boolean
        reminder_time:
          type: string
          description: 알림 시각. 사용자 시간대의 벽시계 시각이고 `HH:MM` 꼴이다
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "20:00"
        default_mode:
          $ref: "#/components/schemas/ConversationMode"
        analysis_enabled:
          type: boolean
          description: 끄면 대화와 일기만 남기고 마음 신호를 뽑지 않는다
        memory_enabled:
          type: boolean
        mood_pick_enabled:
          type: boolean

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    RecordDate:
      type: string
      format: date
      description: |
        기록 날짜. 달력 날짜가 아니라, 사용자의 시간대로 새벽 4시에 바뀌는 하루다.
        서버가 정해서 알려주는 값이다. 웹앱이 시각에서 직접 계산하지 않는다.
      example: "2026-09-20"

    DiaryStatus:
      type: string
      description: |
        `draft` 대화에서 만든 초안이고 사용자가 아직 확인하지 않았다. `confirmed` 사용자가 확인했다.
      enum: [draft, confirmed]

    DiarySummary:
      type: object
      required: [date, status, first_line]
      properties:
        date:
          $ref: "#/components/schemas/RecordDate"
        status:
          $ref: "#/components/schemas/DiaryStatus"
        first_line:
          type: string
          description: 지금 화면에 보일 글의 첫 줄. 길면 잘라서 준다. 빈 초안이면 빈 문자열이다
        snippet:
          type: string
          description: 검색어가 나온 자리의 앞뒤 글. 검색 결과에만 있다

    DiaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiarySummary"

    Diary:
      type: object
      required: [date, status, text, confirmed_at, updated_at]
      properties:
        date:
          $ref: "#/components/schemas/RecordDate"
        status:
          $ref: "#/components/schemas/DiaryStatus"
        text:
          type: string
          description: |
            상태가 `draft`면 초안, `confirmed`면 확인한 글이다.
            초안을 만들지 못한 날에는 빈 초안이 온다. 사용자가 직접 써서 확인하면 된다.
        confirmed_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
          description: 마지막으로 확인한 시각. 한 번도 확인하지 않았으면 null이다
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    DiaryUpdate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: 일기 글 전체
          minLength: 1
          maxLength: 10000

    Resource:
      type: object
      required: [id, name, phone, description]
      properties:
        id:
          type: string
          description: 자원을 가리키는 고정된 이름. 화면이 아이콘을 고르거나 목록을 견줄 때 쓴다
          example: suicide_prevention_109
        name:
          type: string
          example: 자살예방상담전화
        phone:
          type: string
          description: 전화번호. 화면에 그대로 보여주고, 걸 때는 숫자만 남겨 `tel:`에 넣는다
          example: "109"
        description:
          type: string
          description: 언제, 어떤 도움을 받을 수 있는지에 대한 한두 문장
          example: 24시간, 지금 바로 이야기를 들어줄 사람과 연결돼요.

    ResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 급한 곳이 앞에 온다
          items:
            $ref: "#/components/schemas/Resource"

    # ---- 마음 신호 --------------------------------------------------------------------
    # 식별자는 계산 코어가 쓰는 값과 글자까지 같다. 한번 정한 뒤에는 바꾸지 않는다.

    SignalItem:
      type: string
      description: |
        점수에 쓰는 여덟 항목. 자해나 자살에 관한 표현은 항목이 아니다. 그것은 위기 관문이 따로 맡는다.
        `interest` 흥미와 즐거움이 줄어듦, `mood` 우울하거나 희망이 없음, `sleep` 잠, `fatigue` 피곤하고 기운이 없음,
        `appetite` 입맛, `self_blame` 자신을 탓하거나 쓸모없다고 느낌, `concentration` 집중,
        `psychomotor` 말과 움직임이 느려지거나 안절부절못함.
      enum: [interest, mood, sleep, fatigue, appetite, self_blame, concentration, psychomotor]

    SignalStatus:
      type: string
      description: |
        한 항목에 대한 판단. `observed` 그 신호가 있었다, `not_observed` 이야기가 나왔고 괜찮았다,
        `not_mentioned` 이야기가 없었다. 언급 없음은 "없었다"가 아니라 "모른다"에 가깝다.
      enum: [observed, not_observed, not_mentioned]

    SignalExplicitness:
      type: string
      description: |
        판단의 근거가 얼마나 분명했는지. `direct` 사용자가 직접 말했다, `indirect` 사용자의 말에서 미루어 짐작했다,
        `none` 근거가 없다(언급 없음인 판단에만 붙는다).
      enum: [direct, indirect, none]

    SignalRate:
      type: object
      description: 대화한 날 가운데 며칠에서 관찰됐는지. 화면이 "9일 중 3일"처럼 일수로 말할 수 있게 비율이 아니라 일수 둘로 준다
      required: [observed_days, days]
      properties:
        observed_days:
          type: integer
          minimum: 0
        days:
          type: integer
          description: 견준 기간에서 대화한 날 수
          minimum: 0

    TrendRowKey:
      type: string
      description: |
        추세 화면의 줄. `mood` 기분(흥미 저하와 우울감 가운데 하나라도 해당하면 찍힌다), `sleep` 수면, `energy` 에너지.
        여덟 항목을 다 그리지 않고, 사용자가 자기 말로 떠올리기 쉬운 셋만 줄로 보여준다. 나머지는 근거 화면에서 본다.
      enum: [mood, sleep, energy]

    TrendMark:
      type: string
      description: |
        점 달력 한 칸의 표시. `no_conversation` 대화하지 않은 날(빈칸), `not_mentioned` 대화는 했지만 그 줄의 이야기가 없었던 날(작은 점),
        `not_observed` 이야기가 나왔고 괜찮았던 날(빈 점), `observed` 그 줄의 신호가 관찰된 날(찬 점).
        분석이 아직 끝나지 않은 날은 대화하지 않은 날과 같은 표시다. 분석이 끝나면 그 칸이 채워진다.
      enum: [no_conversation, not_mentioned, not_observed, observed]

    TrendComparison:
      type: string
      description: |
        최근 기간의 빈도를 평소와 견준 결과. `more_often` 평소보다 잦음, `similar` 평소와 비슷함, `less_often` 평소보다 드묾,
        `none` 견줄 수 없음(평소가 아직 없거나 기록이 모자라다). `none`이면 화면에 일수만 보여주고 평소와 견주는 말은 붙이지 않는다.
      enum: [none, less_often, similar, more_often]

    TrendCell:
      type: object
      description: 점 달력의 한 칸
      required: [date, mark]
      properties:
        date:
          $ref: "#/components/schemas/RecordDate"
        mark:
          $ref: "#/components/schemas/TrendMark"

    TrendRow:
      type: object
      description: |
        점 달력의 한 줄. "14일 중 7일, 평소보다 잦음"이라는 말을 만드는 데 필요한 값이 모두 있다.
        화면은 나누거나 세지 않고 이 값을 그대로 쓴다.
      required: [row, cells, window, comparison]
      properties:
        row:
          $ref: "#/components/schemas/TrendRowKey"
        cells:
          type: array
          description: 창의 첫날부터 기준일까지 날짜마다 한 칸. 대화하지 않은 날도 들어 있다
          items:
            $ref: "#/components/schemas/TrendCell"
        window:
          allOf:
            - $ref: "#/components/schemas/SignalRate"
          description: 최근 기간의 빈도. `days`는 창 안에서 대화한 일수이고 줄마다 같다
        usual:
          allOf:
            - $ref: "#/components/schemas/SignalRate"
          nullable: true
          description: |
            평소의 빈도. 개인 기준선이 아직 잡히지 않았으면 null이다.
            모으는 중인 값은 아직 평소가 아니므로 내보내지 않는다.
        comparison:
          $ref: "#/components/schemas/TrendComparison"

    Trend:
      type: object
      description: |
        추세 화면이 그리는 점 달력 전부. 줄은 언제나 기분, 수면, 에너지 셋이고 그 순서대로 온다.
        추정 점수와 개입 단계는 담기지 않는다.
      required: [as_of, from, to, conversation_days, insufficient_records, baseline_pending, rows]
      properties:
        as_of:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          description: |
            이 값을 계산한 기준일이고 달력의 마지막 날이다.
            오늘의 분석이 아직 없으면 어제가 기준일이 된다. 오늘 한 대화는 분석이 끝난 뒤에 이 화면에 나타난다.
        from:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          description: 달력의 첫날
        to:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          description: 달력의 마지막 날. `as_of`와 같다
        conversation_days:
          type: integer
          description: 창 안에서 대화하고 분석이 끝난 날의 수
          minimum: 0
        insufficient_records:
          type: boolean
          description: |
            창 안에서 대화한 날이 모자라 추정을 하지 않았다는 뜻이다.
            참이면 화면은 점 달력만 보여주고 평소와 견주는 말은 붙이지 않는다. 며칠 더 기록하면 된다는 안내를 그 자리에 둔다.
        baseline_pending:
          type: boolean
          description: |
            그 사람의 평소가 아직 정해지지 않았다는 뜻이다. 참이면 모든 줄의 `usual`이 null이고 `comparison`은 `none`이다.
            평소는 첫 대화 날부터 얼마 동안의 기록으로 잡고, 그 기간이 지나야 정해진다.
        rows:
          type: array
          description: 기분, 수면, 에너지 순
          items:
            $ref: "#/components/schemas/TrendRow"

    SignalEvidence:
      type: object
      description: 대화 하나에서 항목 하나에 대해 나온 판단과 그 근거
      required: [id, conversation_id, status, explicitness, evidence, cancelled]
      properties:
        id:
          type: string
          format: uuid
          description: 취소하거나 되돌릴 때 쓰는 ID
        conversation_id:
          type: string
          format: uuid
          description: 그 판단이 나온 대화. 하루에 여러 번 대화했을 때 어느 대화에서 나왔는지 보여주는 데 쓴다
        status:
          $ref: "#/components/schemas/SignalStatus"
        explicitness:
          $ref: "#/components/schemas/SignalExplicitness"
        evidence:
          type: string
          nullable: true
          description: |
            판단의 근거가 된 사용자의 말을 글자 그대로 옮긴 것이다. 언급 없음인 판단은 null이다.
            AI가 지어낸 요약이 아니라 사용자가 한 말이어야 한다. 그래서 화면은 이 글을 그대로 보여준다.
        utterance_seq:
          type: integer
          nullable: true
          description: 근거가 어느 발화에서 왔는지(대화 안의 순번). 가리키는 발화가 없으면 null이다
          minimum: 0
        cancelled:
          type: boolean
          description: 사용자가 "이건 아니에요"로 취소했는지. 참이면 계산에서 빠져 있다

    DaySignalItem:
      type: object
      description: |
        하루의 한 항목이다. `status`와 `explicitness`는 그날 그 항목의 판단으로,
        취소한 행을 뺀 뒤에 합친 값이다. 하루에 한 번이라도 관찰되면 관찰됨이고, 근거가 더 분명한 쪽의 명시성을 쓴다.
      required: [item, status, explicitness, rows]
      properties:
        item:
          $ref: "#/components/schemas/SignalItem"
        status:
          $ref: "#/components/schemas/SignalStatus"
        explicitness:
          $ref: "#/components/schemas/SignalExplicitness"
        rows:
          type: array
          description: 그 항목에 대해 나온 판단. 하루에 대화를 여러 번 했으면 대화마다 하나씩이다
          items:
            $ref: "#/components/schemas/SignalEvidence"

    DaySignals:
      type: object
      description: 하루의 마음 신호 전부
      required: [date, analysed, items]
      properties:
        date:
          $ref: "#/components/schemas/RecordDate"
        analysed:
          type: boolean
          description: |
            그날 분석이 끝난 대화가 있는지. 거짓이면 `items`는 비어 있다.
            대화하지 않은 날, 분석이 도는 중인 날, 분석을 꺼 둔 날이 모두 거짓이다.
        items:
          type: array
          description: "`analysed`가 참이면 여덟 항목이 정해진 순서로 온다. 언급이 없었던 항목도 빠지지 않는다"
          items:
            $ref: "#/components/schemas/DaySignalItem"

    # ---- 내부 확인 화면 ----------------------------------------------------------------
    # 시연 계정과 관리자만 읽는다. 계산 코어가 들고 있는 값을 중간값까지 그대로 옮긴다.

    ScoreBand:
      type: string
      description: |
        추정 점수(0~24)가 드는 구간. 여덟 항목 척도에서 널리 쓰는 구간을 그대로 따른다.
        `none`은 기록이 모자라 점수를 내지 않았다는 뜻이다. 0점과는 다르다.
      enum: [none, minimal, mild, moderate, moderately_severe, severe]

    ConfidenceLevel:
      type: string
      description: |
        신뢰도의 구간. `medium` 이상이어야 개입 단계를 올린다. 기록 부족도 `low`다.
      enum: [low, medium, high]

    ConfidenceComponent:
      type: string
      description: |
        신뢰도를 이루는 세 요소. `record_coverage` 기록 충실도, `item_coverage` 항목 충족도,
        `explicitness` 근거 명시성. `none`은 최종 값을 계산하지 않아 가리킬 요소가 없다는 뜻이다.
      enum: [none, record_coverage, item_coverage, explicitness]

    StageReason:
      type: string
      description: |
        그날의 개입 단계를 그 값으로 만든 조건. 단계를 실제로 움직인 조건만 적는다.
        `score` 점수가 올렸다, `change_detected` 점수로는 0단계인데 변화 감지 상태여서 1단계가 되었다,
        `sustained` 2단계 이상이 정해진 일수째 이어져 3단계가 되었다,
        `held_no_record_today` 그날 대화한 기록이 없어 오르지 못했다,
        `held_one_step_per_day` 하루에 한 단계만 올랐다,
        `held_low_confidence` 신뢰도가 낮아 오르지 못했다,
        `held_insufficient_records` 기록 부족이어서 오르지 못했다,
        `carried_insufficient_records` 기록 부족이어서 전날의 단계를 그대로 이어 갔다,
        `no_recent_records` 창 안에 대화한 날이 하나도 없어 0단계로 돌아갔다.
      enum:
        - score
        - change_detected
        - sustained
        - held_no_record_today
        - held_one_step_per_day
        - held_low_confidence
        - held_insufficient_records
        - carried_insufficient_records
        - no_recent_records

    ReviewRatio:
      type: object
      description: 센 값 그대로의 분수다. 약분하지 않는다. "14일 중 7일"처럼 센 값을 그대로 보여줄 수 있게 소수로 바꾸지 않는다
      required: [num, den]
      properties:
        num:
          type: integer
        den:
          type: integer

    ReviewExtractor:
      type: object
      description: |
        신호 행에 남은 추출기 표시 하나와 그 표시로 남은 행의 수다. 표시는 지시문의 판과 실제로 답한 모델을 담는다.
        추출 방식을 바꾼 앞뒤를 견주는 데도 쓰고, 정해 둔 답으로 채운 행을 가려내는 데도 쓴다.
      required: [version, rows, last_at]
      properties:
        version:
          type: string
          description: 신호 행에 저장된 표시. 지시문의 판과 모델 이름이다
        rows:
          type: integer
          description: 그 표시로 남은 신호 행의 수. 취소한 행도 센다
          minimum: 0
        last_at:
          type: string
          format: date-time
          description: 그 표시로 남은 가장 최근 행의 시각

    ReviewScoreItem:
      type: object
      description: 항목 하나가 어떻게 점수가 되었는지. 중간값을 버리지 않는다
      required: [item, observed_days, converted_days, points]
      properties:
        item:
          $ref: "#/components/schemas/SignalItem"
        observed_days:
          type: integer
          description: 창 안에서 그 항목이 관찰된 일수. 기록 부족이어도 센다
          minimum: 0
        converted_days:
          type: integer
          description: 관찰된 일수를 창의 길이에 맞춰 환산한 일수(창의 길이 × 관찰 일수 ÷ 대화한 일수). 기록 부족이면 0이다
          minimum: 0
        points:
          type: integer
          description: 항목 점수(0~3). 환산 일수의 경계에서 나온다. 기록 부족이면 0이다
          minimum: 0
          maximum: 3

    ReviewScore:
      type: object
      description: 기준일의 추정 점수와 그 값이 나온 과정
      required: [window_from, window_to, conversation_days, insufficient, items, total, band]
      properties:
        window_from:
          $ref: "#/components/schemas/RecordDate"
        window_to:
          $ref: "#/components/schemas/RecordDate"
        conversation_days:
          type: integer
          minimum: 0
        insufficient:
          type: boolean
          description: |
            대화한 날이 모자라 점수를 내지 않았다는 뜻이다. 0점("충분히 들었고 신호가 없었다")과는 다른 상태다.
            참이면 `total`, `band`, 항목별 환산 일수와 점수는 구하지 않은 값이므로 읽지 않는다.
        items:
          type: array
          description: 여덟 항목이 정해진 순서로 온다
          items:
            $ref: "#/components/schemas/ReviewScoreItem"
        total:
          type: integer
          description: 여덟 항목 점수의 합(0~24)
          minimum: 0
          maximum: 24
        band:
          $ref: "#/components/schemas/ScoreBand"

    ReviewConfidence:
      type: object
      description: |
        기준일의 신뢰도와 그 값이 나온 과정. 최종 값은 세 요소의 평균이 아니라 가장 작은 값이다.
        평균을 내면 한 요소가 아주 나빠도 다른 요소에 묻힌다.
      required:
        - conversation_days
        - mentioned_items
        - missing_items
        - observed_judgements
        - direct_judgements
        - record_coverage
        - item_coverage
        - explicitness
        - insufficient
        - value
        - limiting
        - level
      properties:
        conversation_days:
          type: integer
          minimum: 0
        mentioned_items:
          type: integer
          description: 창 안에서 한 번이라도 이야기가 나온 항목의 수
          minimum: 0
        missing_items:
          type: array
          description: 창 안에서 한 번도 이야기가 나오지 않은 항목. 다음 대화에서 자연스럽게 물어볼 항목을 고르는 데 쓴다
          items:
            $ref: "#/components/schemas/SignalItem"
        observed_judgements:
          type: integer
          description: 창 안의 관찰됨 판단 수. 하루의 항목 하나가 판단 하나다
          minimum: 0
        direct_judgements:
          type: integer
          description: 그 가운데 사용자가 직접 말한 것에 근거한 판단 수
          minimum: 0
        record_coverage:
          allOf:
            - $ref: "#/components/schemas/ReviewRatio"
          description: 기록 충실도. 대화한 일수 ÷ 창의 길이
        item_coverage:
          allOf:
            - $ref: "#/components/schemas/ReviewRatio"
          description: 항목 충족도. 이야기가 나온 항목 수 ÷ 여덟
        explicitness:
          allOf:
            - $ref: "#/components/schemas/ReviewRatio"
          description: |
            근거 명시성. 직접 언급 판단 수 ÷ 관찰됨 판단 수.
            관찰됨이 하나도 없으면 1/1이다. 따질 판단이 없는 것이지 근거가 흐린 것이 아니다.
        insufficient:
          type: boolean
          description: 기록 부족이라는 뜻이다. 참이면 `value`는 0/0이고 `limiting`은 `none`, `level`은 `low`다
        value:
          allOf:
            - $ref: "#/components/schemas/ReviewRatio"
          description: 최종 값. 세 요소 가운데 가장 작은 값을 센 값 그대로 담는다
        limiting:
          $ref: "#/components/schemas/ConfidenceComponent"
        level:
          $ref: "#/components/schemas/ConfidenceLevel"

    ReviewBaseline:
      type: object
      description: |
        그 사람의 평소. 첫 대화 날부터 얼마 동안의 기록으로 잡고 한번 잡히면 고정한다.
        기간 안의 날을 사용자가 지웠을 때만 다시 정해진다. `established`가 거짓인 동안의 값은 "지금까지 모인 값"이고 평소로 쓰면 안 된다.
      required: [established, extended, days, observed_total, mu, item_rates, trend_rates]
      properties:
        established:
          type: boolean
          description: 기준일에 평소가 잡혀 있는지. 기간의 마지막 날이 지나야 참이 된다
        start:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          nullable: true
          description: 기간의 첫날, 곧 첫 대화 날. 대화한 날이 없으면 null이다
        end:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          nullable: true
          description: 기간의 마지막 날. 기준일까지의 기록으로 아직 정할 수 없으면 null이다
        extended:
          type: boolean
          description: 첫 기간 안에 대화한 날이 모자라서 기간을 늘렸는지
        days:
          type: integer
          description: 평소를 정하는 데 쓴 대화한 날 수
          minimum: 0
        observed_total:
          type: integer
          description: 그 날들의 "그날 관찰된 항목 수"를 모두 더한 값. `mu`의 분자다
          minimum: 0
        mu:
          type: number
          format: double
          description: 평소의 하루 평균 신호 수. `observed_total` ÷ `days`이고 `days`가 0이면 0이다
        item_rates:
          type: array
          description: 항목별 관찰 비율. 여덟 항목이 정해진 순서로 온다
          items:
            $ref: "#/components/schemas/ReviewItemRate"
        trend_rates:
          type: array
          description: 추세 화면의 줄별 관찰 비율. 기분, 수면, 에너지 순
          items:
            $ref: "#/components/schemas/ReviewTrendRate"

    ReviewItemRate:
      type: object
      required: [item, rate]
      properties:
        item:
          $ref: "#/components/schemas/SignalItem"
        rate:
          $ref: "#/components/schemas/SignalRate"

    ReviewTrendRate:
      type: object
      required: [row, rate]
      properties:
        row:
          $ref: "#/components/schemas/TrendRowKey"
        rate:
          $ref: "#/components/schemas/SignalRate"

    ReviewChangePoint:
      type: object
      description: 변화 탐지가 누적한 날 하루
      required: [date, observed, step, capped, at_ceiling, s, detected]
      properties:
        date:
          $ref: "#/components/schemas/RecordDate"
        observed:
          type: integer
          description: 그날 관찰된 항목 수
          minimum: 0
        step:
          type: number
          format: double
          description: 그날 누적값에 더한 값(관찰된 항목 수 − 평소의 하루 평균 − 허용 여유). 상한에 걸렸으면 상한값이다
        capped:
          type: boolean
          description: 하루 증가량의 상한에 걸려 `step`이 줄었는지
        at_ceiling:
          type: boolean
          description: 누적값이 천장에 걸려 그날의 증가량이 다 쌓이지 못했는지
        s:
          type: number
          format: double
          description: 그날까지의 누적값. 보여주기 위한 값이다. 감지 여부는 이 값을 한계값과 견주지 말고 `detected`에서 읽는다
        detected:
          type: boolean

    ReviewChange:
      type: object
      description: |
        평소에서 벗어난 정도를 날마다 쌓아 변화를 알아챈 흐름이다. 평소가 잡히기 전에는 돌지 않는다.
        누적값이 한계값을 넘으면 감지이고, 넘은 뒤에도 0으로 되돌리지 않는다. 나아지면 줄어들어 저절로 풀린다.
      required: [running, detected, s, series]
      properties:
        running:
          type: boolean
          description: 기준일에 변화 탐지가 돌고 있는지. 평소가 잡히기 전에는 거짓이다
        detected:
          type: boolean
          description: 기준일에 변화 감지 상태인지
        s:
          type: number
          format: double
          description: 기준일까지의 누적값
        from:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          nullable: true
          description: 누적을 시작한 날짜, 곧 평소 기간의 마지막 날 다음 날. 평소가 잡히지 않았으면 null이다
        series:
          type: array
          description: 누적을 시작한 날부터 기준일까지 대화한 날마다 하나. 대화하지 않은 날은 없다
          items:
            $ref: "#/components/schemas/ReviewChangePoint"

    ReviewStagePoint:
      type: object
      description: |
        달력 날짜 하루의 개입 단계와 그 단계가 나온 과정. 대화하지 않은 날도 들어 있다.
        단계는 대화한 날에만 오르고, 하루에 한 단계만 오르고, 신뢰도가 낮은 날에는 오르지 않는다.
      required:
        - date
        - has_record
        - conversation_days
        - insufficient
        - score
        - confidence
        - detected
        - raw
        - stage
        - held
        - elevated_days
        - reasons
      properties:
        date:
          $ref: "#/components/schemas/RecordDate"
        has_record:
          type: boolean
          description: 그날 대화하고 분석이 끝난 기록이 있는지. 단계는 이 값이 참인 날에만 오른다
        conversation_days:
          type: integer
          description: 그날을 기준일로 한 창 안에서 대화한 일수
          minimum: 0
        insufficient:
          type: boolean
          description: 기록 부족이어서 그날의 추정 점수를 내지 않았다는 뜻이다. 참이면 `score`는 읽지 않는다
        score:
          type: integer
          description: 그날의 추정 점수(0~24). `insufficient`가 참이면 구하지 않은 값이다
          minimum: 0
          maximum: 24
        confidence:
          $ref: "#/components/schemas/ConfidenceLevel"
        detected:
          type: boolean
          description: 그날 변화 감지 상태였는지
        raw:
          type: integer
          description: 그날의 값만으로 정한 단계(0~3). 전날과 견줘 묶거나 이어 가기 전의 값이다
          minimum: 0
          maximum: 3
        stage:
          type: integer
          description: 그날의 개입 단계(0~3). 0 일상, 1 회고, 2 제안, 3 권유
          minimum: 0
          maximum: 3
        held:
          type: boolean
          description: 단계가 오르려던 만큼 오르지 못했다는 뜻이다. 까닭은 `reasons`에 있다
        elevated_days:
          type: integer
          description: 2단계 이상이 그날까지 달력 날짜로 며칠째 이어졌는지. 2단계 미만이면 0이다
          minimum: 0
        reasons:
          type: array
          description: 단계를 실제로 움직인 조건. 없으면 빈 배열이다
          items:
            $ref: "#/components/schemas/StageReason"

    ReviewStage:
      type: object
      description: |
        첫 대화 날부터 기준일까지 하루씩 다시 돌린 개입 단계의 흐름이다.
        결과를 저장해 두지 않기 때문에 사용자가 지난 하루를 지우면 그 뒤의 단계가 모두 다시 정해진다.
      required: [stage, series]
      properties:
        stage:
          type: integer
          description: 기준일의 개입 단계(0~3)
          minimum: 0
          maximum: 3
        from:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          nullable: true
          description: 흐름의 첫날, 곧 첫 대화 날. 대화한 날이 없으면 null이다
        series:
          type: array
          description: 첫날부터 기준일까지 달력의 하루하루. 대화하지 않은 날도 들어 있다
          items:
            $ref: "#/components/schemas/ReviewStagePoint"

    ReviewParams:
      type: object
      description: |
        이 계산에 쓴 조정 값이다. 결과를 읽을 때 함께 필요한 경계를 화면이 코드에 박아 두지 않게 한다
        (누적값 옆에 한계값을 그리거나, 점수 옆에 구간의 경계를 표시할 때).
      required:
        - window_days
        - min_conversation_days
        - item_score_min_days
        - band_min_scores
        - confidence_medium_min
        - confidence_high_min
        - baseline_window_days
        - baseline_min_conversation_days
        - cusum_k
        - cusum_h
        - cusum_max_step
        - cusum_max_s
        - stage_min_scores
        - sustained_stage2_days
        - trend_min_difference_percent
      properties:
        window_days:
          type: integer
          description: 점수, 신뢰도, 개입 단계가 함께 보는 최근 기간의 길이(기준일 포함)
        min_conversation_days:
          type: integer
          description: 창 안에서 대화한 날이 이보다 적으면 기록 부족이다
        item_score_min_days:
          type: array
          description: 환산 일수가 이 값 이상이면 항목 점수 1, 2, 3을 준다. 세 값이 오름차순으로 온다
          items:
            type: integer
        band_min_scores:
          type: array
          description: 추정 점수가 이 값 이상이면 가벼움, 중간, 다소 심함, 심함 구간이다. 네 값이 오름차순으로 온다
          items:
            type: integer
        confidence_medium_min:
          type: number
          format: double
          description: 신뢰도가 이 값 미만이면 낮음이다
        confidence_high_min:
          type: number
          format: double
          description: 신뢰도가 이 값 이상이면 높음이고, 그 사이는 보통이다
        baseline_window_days:
          type: integer
          description: 첫 대화 날부터(첫날 포함) 평소로 삼는 기간
        baseline_min_conversation_days:
          type: integer
          description: 평소에 필요한 대화 일수. 기간 안에 모자라면 이만큼 찰 때까지 기간을 늘린다
        cusum_k:
          type: number
          format: double
          description: 허용 여유. 평소보다 이만큼 많은 것까지는 흔한 기복으로 보고 쌓지 않는다
        cusum_h:
          type: number
          format: double
          description: 한계값. 누적값이 이 값을 넘으면(같으면 아니다) 변화 감지다
        cusum_max_step:
          type: number
          format: double
          description: 하루에 늘 수 있는 누적값의 상한. 0이면 상한이 없다
        cusum_max_s:
          type: number
          format: double
          description: 누적값의 천장을 한계값의 몇 배로 둘지. 0이면 천장이 없다
        stage_min_scores:
          type: array
          description: 추정 점수가 이 값 이상이면 1, 2, 3단계다. 세 값이 오름차순으로 온다
          items:
            type: integer
        sustained_stage2_days:
          type: integer
          description: 2단계 이상이 달력 날짜로 이 일수째 이어지는 날부터 3단계로 올린다
        trend_min_difference_percent:
          type: integer
          description: 최근 기간의 빈도와 평소의 빈도가 이 퍼센트포인트 이상 벌어지면 "잦음"이나 "드묾"이다

    InternalReview:
      type: object
      description: |
        기준일 하루의 평가 전부다. 추정 점수, 신뢰도, 평소, 변화 탐지, 개입 단계가 모두 같은 기록과 같은 기준일,
        같은 조정 값에서 나온 값이라 서로 앞뒤가 맞는다.
      required: [as_of, params, extractors, score, confidence, baseline, change, stage]
      properties:
        as_of:
          allOf:
            - $ref: "#/components/schemas/RecordDate"
          description: 기준일. 오늘의 분석이 아직 없으면 어제가 기준일이 된다
        params:
          $ref: "#/components/schemas/ReviewParams"
        extractors:
          type: array
          description: |
            이 계정의 신호 행을 남긴 추출기들이다. 최근에 쓴 것이 앞에 온다. 신호 행이 없으면 빈 배열이다.
            화면에 반드시 띄운다. 키 없이 띄운 서버는 낱말 표로 답하는 모델로도 여덟 항목을 채우기 때문에,
            이 표시가 없으면 화면의 판단과 근거가 실제 모델이 읽은 것인지 가릴 수 없다.
          items:
            $ref: "#/components/schemas/ReviewExtractor"
        score:
          $ref: "#/components/schemas/ReviewScore"
        confidence:
          $ref: "#/components/schemas/ReviewConfidence"
        baseline:
          $ref: "#/components/schemas/ReviewBaseline"
        change:
          $ref: "#/components/schemas/ReviewChange"
        stage:
          $ref: "#/components/schemas/ReviewStage"

    # ---- 대화 채널(WebSocket)의 메시지 ------------------------------------------------
    # 경로와 흐름은 맨 위의 설명에 있다. 어느 경로에서도 가리키지 않지만, 서버와 웹의 타입이 여기서 만들어진다.

    WsClientMessage:
      description: 클라이언트가 대화 채널로 보내는 메시지. `type`으로 가린다
      oneOf:
        - $ref: "#/components/schemas/WsStart"
        - $ref: "#/components/schemas/WsUserText"
        - $ref: "#/components/schemas/WsEnd"
        - $ref: "#/components/schemas/WsSetMode"
        - $ref: "#/components/schemas/WsInterrupt"
        - $ref: "#/components/schemas/WsFinalize"
        - $ref: "#/components/schemas/WsListen"
      discriminator:
        propertyName: type
        mapping:
          start: "#/components/schemas/WsStart"
          user_text: "#/components/schemas/WsUserText"
          end: "#/components/schemas/WsEnd"
          set_mode: "#/components/schemas/WsSetMode"
          interrupt: "#/components/schemas/WsInterrupt"
          finalize: "#/components/schemas/WsFinalize"
          listen: "#/components/schemas/WsListen"

    WsServerMessage:
      description: 서버가 대화 채널로 보내는 메시지. `type`으로 가린다
      oneOf:
        - $ref: "#/components/schemas/WsReady"
        - $ref: "#/components/schemas/WsThinking"
        - $ref: "#/components/schemas/WsAIText"
        - $ref: "#/components/schemas/WsResources"
        - $ref: "#/components/schemas/WsEnded"
        - $ref: "#/components/schemas/WsDiaryReady"
        - $ref: "#/components/schemas/WsError"
        - $ref: "#/components/schemas/WsMode"
        - $ref: "#/components/schemas/WsTranscript"
        - $ref: "#/components/schemas/WsAudioStart"
        - $ref: "#/components/schemas/WsAudioEnd"
        - $ref: "#/components/schemas/WsListening"
      discriminator:
        propertyName: type
        mapping:
          ready: "#/components/schemas/WsReady"
          thinking: "#/components/schemas/WsThinking"
          ai_text: "#/components/schemas/WsAIText"
          resources: "#/components/schemas/WsResources"
          ended: "#/components/schemas/WsEnded"
          diary_ready: "#/components/schemas/WsDiaryReady"
          error: "#/components/schemas/WsError"
          mode: "#/components/schemas/WsMode"
          transcript: "#/components/schemas/WsTranscript"
          audio_start: "#/components/schemas/WsAudioStart"
          audio_end: "#/components/schemas/WsAudioEnd"
          listening: "#/components/schemas/WsListening"

    WsStart:
      type: object
      description: |
        대화를 시작한다. 연결마다 한 번 보낸다. 열린 대화가 있으면 새로 만들지 않고 그 대화를 이어간다.
        기록 날짜가 지나도록 열려 있던 대화는 서버가 먼저 끝내고 새 대화를 연다.
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          type: string
          enum: [start]
        mode:
          allOf:
            - $ref: "#/components/schemas/ConversationMode"
          description: |
            바라는 대화 방식. `voice`를 요청했는데 서버가 음성을 쓸 수 없으면 `error`(`voice_unavailable`) 뒤에 `chat`으로 연다.
            실제로 열린 방식은 `ready.mode`다

    WsUserText:
      type: object
      description: 사용자가 쓴 글 하나
      additionalProperties: false
      required: [type, client_message_id, text]
      properties:
        type:
          type: string
          enum: [user_text]
        client_message_id:
          type: string
          format: uuid
          description: |
            클라이언트가 글마다 새로 만드는 식별자(`crypto.randomUUID()`).
            `thinking`을 받지 못해 다시 보낼 때는 같은 값을 쓴다. 같은 값의 글은 한 번만 저장된다.
        text:
          type: string
          description: 앞뒤 공백을 뗀 글. 공백만 있는 글은 보내지 않는다
          minLength: 1
          maxLength: 2000

    WsEnd:
      type: object
      description: 끝내기 버튼을 눌렀다. 서버는 `ended`로 답한다
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [end]

    WsSetMode:
      type: object
      description: |
        대화 방식을 바꾼다. 서버는 `mode`로 실제 방식을 답한다. `voice`로 바꿀 수 없으면 `error`(`voice_unavailable`) 뒤에 `mode`(`chat`)가 온다.
        같은 대화가 그대로 이어진다
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          type: string
          enum: [set_mode]
        mode:
          $ref: "#/components/schemas/ConversationMode"

    WsInterrupt:
      type: object
      description: |
        AI의 말을 끊는다(끼어들기). 서버는 내려보내던 소리를 멈추고 `audio_end`(`interrupted`)를 보낸다.
        재생 중인 말이 없으면 아무 일도 없다
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [interrupt]

    WsFinalize:
      type: object
      description: 지금까지 알아들은 말을 끝점을 기다리지 않고 바로 확정한다("다 말했어요"). 음성 방식에서만 뜻이 있다
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [finalize]

    WsListen:
      type: object
      description: |
        한 마디만 듣게 한다. `active`가 참이면 서버는 다음 끝점까지 소리를 받고, 끝점이 오면 스스로 듣기를 멈춘다(한 번에 한 마디).
        거짓이면 지금 바로 멈춘다. 멈춘 동안 올라온 소리는 버린다. 서버는 `listening`으로 지금 듣고 있는지 답한다.
        이 메시지를 한 번이라도 보내면 그 연결은 끝점마다 듣기를 멈추는 방식이 된다. 보내지 않으면 음성 방식인 동안 계속 듣는다.
        음성 방식이 아니면 `error`(`invalid_message`)다
      additionalProperties: false
      required: [type, active]
      properties:
        type:
          type: string
          enum: [listen]
        active:
          type: boolean

    WsSpeaker:
      type: string
      description: 누가 한 말인지
      enum: [user, ai]

    WsOrigin:
      type: string
      description: |
        말을 만든 쪽. `user` 사용자, `model` 대화 AI, `fixed` 미리 써 둔 문구,
        `template` 사용자의 표현을 넣어 만든 고정 문형.
      enum: [user, model, fixed, template]

    WsUtterance:
      type: object
      description: 지난 발화 하나. 이어가는 대화의 `ready`에 담겨 온다
      required: [seq, speaker, origin, text, client_message_id, created_at]
      properties:
        seq:
          type: integer
          description: 대화 안에서의 순번. 0부터 하나씩 는다. 화면은 이 순서대로 보여준다
          minimum: 0
        speaker:
          $ref: "#/components/schemas/WsSpeaker"
        origin:
          $ref: "#/components/schemas/WsOrigin"
        text:
          type: string
        client_message_id:
          type: string
          format: uuid
          nullable: true
          description: 사용자의 글이면 보낼 때 붙인 식별자다. 아직 답을 받지 못한 글과 견주는 데 쓴다. AI의 말이면 null이다
        created_at:
          $ref: "#/components/schemas/Timestamp"

    WsReady:
      type: object
      description: "`start`의 답. 이 메시지를 받은 뒤에 글을 보낼 수 있다"
      required: [type, conversation_id, record_date, resumed, utterances, resources_pinned, mode, voice_available]
      properties:
        type:
          type: string
          enum: [ready]
        mode:
          allOf:
            - $ref: "#/components/schemas/ConversationMode"
          description: 실제로 열린 대화 방식. `voice`면 소리를 올려 보낼 수 있고 답이 소리로도 온다
        voice_available:
          type: boolean
          description: 이 서버가 음성 방식을 쓸 수 있는지. 거짓이면 `set_mode`로 `voice`를 요청해도 열리지 않는다
        conversation_id:
          type: string
          format: uuid
        record_date:
          $ref: "#/components/schemas/RecordDate"
        resumed:
          type: boolean
          description: 열려 있던 대화를 이어가는 것이면 참이다. 거짓이면 새 대화이고 곧이어 첫 안부가 `ai_text`로 온다
        utterances:
          type: array
          description: 이어가는 대화의 지난 발화. 순번대로다. 새 대화면 비어 있다
          items:
            $ref: "#/components/schemas/WsUtterance"
        resources_pinned:
          type: boolean
          description: 이 대화에서 도움 자원을 화면에 고정해 두었는지. 참이면 곧이어 `resources`가 온다

    WsThinking:
      type: object
      description: |
        글을 받아 저장했고 답을 준비하고 있다. 받았다는 확인이기도 하다.
        이 메시지가 오지 않으면 같은 `client_message_id`로 다시 보낸다.
      required: [type, client_message_id, seq]
      properties:
        type:
          type: string
          enum: [thinking]
        client_message_id:
          type: string
          format: uuid
          description: 어느 글에 대한 것인지
        seq:
          type: integer
          description: 그 글에 붙은 순번
          minimum: 0

    WsAIText:
      type: object
      description: AI의 말 하나. 한 번에 통째로 온다
      required: [type, seq, text, origin]
      properties:
        type:
          type: string
          enum: [ai_text]
        seq:
          type: integer
          minimum: 0
        text:
          type: string
        origin:
          allOf:
            - $ref: "#/components/schemas/WsOrigin"
          description: "`model`, `fixed`, `template` 가운데 하나다"

    WsResources:
      type: object
      description: 화면에 고정해 둘 도움 자원. 받은 뒤로는 대화가 끝날 때까지 고정해 둔다
      required: [type, items]
      properties:
        type:
          type: string
          enum: [resources]
        items:
          type: array
          description: 급한 곳이 앞에 온다
          items:
            $ref: "#/components/schemas/Resource"

    WsEndReason:
      type: string
      description: |
        `user` 끝내기 버튼을 눌렀다. `idle` 한동안 말이 없어 서버가 닫았다.
      enum: [user, idle]

    WsEnded:
      type: object
      description: 대화가 끝났다. 이 연결로는 더 보낼 수 없다. 다시 이야기하려면 새로 연결해 `start`를 보낸다
      required: [type, reason, record_date, diary_expected]
      properties:
        type:
          type: string
          enum: [ended]
        reason:
          $ref: "#/components/schemas/WsEndReason"
        record_date:
          $ref: "#/components/schemas/RecordDate"
        diary_expected:
          type: boolean
          description: |
            일기 초안을 만들고 있으면 참이다. 준비되면 `diary_ready`가 온다.
            거짓이면 초안은 만들어지지 않는다. 사용자가 한 말이 없었거나, 초안을 자동으로 만들지 않는 대화였다.

    WsDiaryReady:
      type: object
      description: 일기 초안이 준비됐다. `GET /api/v1/diaries/{date}`로 읽는다
      required: [type, record_date]
      properties:
        type:
          type: string
          enum: [diary_ready]
        record_date:
          $ref: "#/components/schemas/RecordDate"

    WsMode:
      type: object
      description: 실제 대화 방식이 바뀌었다. `set_mode`의 답이거나, 음성을 더 이어갈 수 없어 서버가 `chat`으로 내린 것이다
      required: [type, mode]
      properties:
        type:
          type: string
          enum: [mode]
        mode:
          $ref: "#/components/schemas/ConversationMode"

    WsTranscript:
      type: object
      description: |
        음성 방식에서 알아들은 사용자의 말. `final`이 거짓이면 지금 말하고 있는 한 마디의 중간 결과(누적)라 자막에만 쓴다.
        참이면 끝점까지의 한 마디이고, 그 글로 턴이 돈다. 뒤이어 같은 `client_message_id`의 `thinking`이 온다
      required: [type, text, final]
      properties:
        type:
          type: string
          enum: [transcript]
        text:
          type: string
        final:
          type: boolean
        client_message_id:
          type: string
          format: uuid
          description: "`final`이 참일 때 그 말에 붙은 식별자. 서버가 만든다"

    WsAudioStart:
      type: object
      description: 이 뒤의 바이너리 프레임은 `seq`의 말을 읽은 소리다
      required: [type, seq, sample_rate]
      properties:
        type:
          type: string
          enum: [audio_start]
        seq:
          type: integer
          minimum: 0
          description: 어느 `ai_text`의 소리인지
        sample_rate:
          type: integer
          description: 소리의 샘플레이트(Hz). PCM s16le 모노다
          minimum: 8000

    WsListening:
      type: object
      description: 서버가 지금 사용자의 말을 듣고 있는지. `listen`의 답이거나, 한 마디가 끝나 스스로 멈췄다는 알림이다
      required: [type, active]
      properties:
        type:
          type: string
          enum: [listening]
        active:
          type: boolean

    WsAudioEndReason:
      type: string
      description: |
        `done` 끝까지 보냈다. `interrupted` 사용자가 끼어들어 멈췄다. `failed` 소리를 만들지 못했다. 글은 이미 `ai_text`로 갔다.
      enum: [done, interrupted, failed]

    WsAudioEnd:
      type: object
      description: "`seq`의 소리가 끝났다. 이 뒤로 그 말의 바이너리 프레임은 오지 않는다"
      required: [type, seq, reason]
      properties:
        type:
          type: string
          enum: [audio_end]
        seq:
          type: integer
          minimum: 0
        reason:
          $ref: "#/components/schemas/WsAudioEndReason"

    WsErrorCode:
      type: string
      description: |
        `invalid_message` JSON이 아니거나, 모르는 `type`이거나, 모양이 틀렸다.
        `message_too_large` 메시지가 너무 크다.
        `rate_limited` 너무 자주 보냈다. 잠시 뒤에 같은 `client_message_id`로 다시 보낸다.
        `not_started` `start`보다 먼저 다른 메시지를 보냈다.
        `already_started` `start`를 두 번 보냈다.
        `unsupported_mode` 지금은 받지 않는 대화 방식이다.
        `conversation_ended` 이미 끝난 대화다. 새로 연결해 `start`를 보낸다.
        `internal_error` 서버 쪽 문제다. 글은 저장되지 않았을 수 있다. 같은 `client_message_id`로 다시 보내도 된다.
        `voice_unavailable` 음성 방식을 열 수 없다(서버에 음성이 없거나, 인식이 죽어 이어갈 수 없다). 대화는 `chat`으로 이어진다.
      enum:
        - invalid_message
        - message_too_large
        - rate_limited
        - not_started
        - already_started
        - unsupported_mode
        - conversation_ended
        - internal_error
        - voice_unavailable

    WsError:
      type: object
      description: 요청을 처리하지 못했다. 사용자가 쓴 글은 담지 않는다
      required: [type, code]
      properties:
        type:
          type: string
          enum: [error]
        code:
          $ref: "#/components/schemas/WsErrorCode"
        client_message_id:
          type: string
          format: uuid
          description: 어느 글을 처리하다 난 오류인지. 글과 상관없는 오류에는 없다

    Me:
      type: object
      required: [user, settings]
      properties:
        user:
          $ref: "#/components/schemas/User"
        settings:
          $ref: "#/components/schemas/SettingsSummary"

    ProblemCode:
      type: string
      description: 오류의 종류. 값은 바뀌지 않는다. 화면은 이 값으로 안내 문구를 고른다
      enum:
        - validation_failed
        - invalid_credentials
        - unauthenticated
        - cross_origin_rejected
        - forbidden
        - not_found
        - method_not_allowed
        - email_taken
        - payload_too_large
        - unsupported_media_type
        - weak_password
        - consent_required
        - rate_limited
        - internal_error
        - service_unavailable

    PasswordReason:
      type: string
      description: |
        비밀번호를 받지 않는 이유.
        `too_short` 너무 짧다, `too_long` 너무 길다, `too_common` 누구나 먼저 넣어 보는 흔한 비밀번호다,
        `matches_email` 이메일 주소나 그 앞부분과 같다, `invalid_encoding` 글자로 읽을 수 없는 바이트가 있다.
      enum: [too_short, too_long, too_common, matches_email, invalid_encoding]

    ProblemField:
      type: string
      description: 받을 수 없는 값이 든 요청 필드의 이름. 쿼리 매개변수일 때는 그 이름이다
      enum: [email, display_name, timezone, text, q]

    ConsentProblem:
      type: object
      description: "`consent_required`일 때만 있다"
      required: [missing, outdated]
      properties:
        missing:
          type: array
          description: 필요한데 오지 않은 동의
          items:
            $ref: "#/components/schemas/ConsentKind"
        outdated:
          type: array
          description: 왔지만 지금 판이 아닌 동의. 가입 규칙을 다시 받아 새 문서를 보여줘야 한다
          items:
            $ref: "#/components/schemas/ConsentKind"

    Problem:
      type: object
      description: RFC 9457의 오류 본문에 `code`와 `request_id`를 더한 것
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          description: 오류 종류를 가리키는 URI 참조. `/problems/{code}` 꼴이다
          example: /problems/weak_password
        title:
          type: string
          description: 개발자가 읽는 짧은 영어 문구. 사용자에게 보여주지 않는다
          example: Password does not meet the policy
        status:
          type: integer
          description: HTTP 상태 코드와 같은 값
          example: 422
        code:
          $ref: "#/components/schemas/ProblemCode"
        request_id:
          type: string
          description: 이 요청의 ID. 응답의 `X-Request-Id` 헤더와 같다. 문의할 때 알려주면 서버 로그에서 찾을 수 있다
        reasons:
          type: array
          description: "`weak_password`일 때만 있다"
          items:
            $ref: "#/components/schemas/PasswordReason"
        consents:
          $ref: "#/components/schemas/ConsentProblem"
        fields:
          type: array
          description: "422 `validation_failed`일 때만 있다"
          items:
            $ref: "#/components/schemas/ProblemField"
