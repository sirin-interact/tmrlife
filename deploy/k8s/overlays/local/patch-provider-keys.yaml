# 실제 음성, 대화 기능까지 확인하고 싶을 때만 쓴다. 이 Secret은 없어도 된다(optional).
# 키를 파일에 적지 않고 셸의 환경 변수에서 바로 만든다:
#
#   kubectl --context orbstack -n naeil-local create secret generic naeil-provider-keys \
#     --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
#     --from-literal=SONIOX_API_KEY="$SONIOX_API_KEY" \
#     --from-literal=ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY"
#
# 만든 뒤에는 파드를 다시 띄워야 읽힌다: make -C deploy local-restart
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: naeil-provider-keys
      optional: true
