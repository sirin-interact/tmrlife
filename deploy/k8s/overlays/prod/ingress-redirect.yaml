# HTTP(80)로 들어온 요청을 HTTPS로 돌려보내는 전용 Ingress.
#
# 주 Ingress는 HTTPS 진입점(websecure)에만 묶여 있다. 거기에 리다이렉트를 달아도 HTTP 요청은 닿지 못하고 404를 받는다.
# 그래서 HTTP 진입점(web)에 묶인 Ingress를 따로 둔다.
# 인증서 발급 확인(/.well-known/acme-challenge/)은 cert-manager가 더 구체적인 경로로 임시 Ingress를 만들기 때문에
# 이 규칙보다 먼저 잡힌다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naeil-http-redirect
  labels:
    app.kubernetes.io/name: naeil-http-redirect
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: naeil
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # 형식은 <네임스페이스>-<미들웨어 이름>@kubernetescrd 이다. 네임스페이스를 바꾸면 앞부분도 바꾼다.
    traefik.ingress.kubernetes.io/router.middlewares: naeil-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          # 미들웨어가 먼저 응답하므로 요청이 실제로 여기까지 오지는 않는다. Ingress 형식상 백엔드가 있어야 한다.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: naeil-web
                port:
                  name: http
