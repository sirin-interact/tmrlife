apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# K3s 운영 배포. 적용하기 전에 고칠 곳은 두 군데다.
#   1. params.yaml      도메인과 인증서 발급자 이름
#   2. 아래 images의 newTag  배포할 이미지 태그
# 클러스터에 미리 있어야 하는 것(CloudNativePG, cert-manager, Secret naeil-secrets)은 deploy/README.md에 적혀 있다.

namespace: naeil

resources:
  - ../../base
  - namespace.yaml
  - params.yaml
  - database.yaml
  - networkpolicy-database.yaml
  - certificate.yaml
  - traefik-middlewares.yaml
  - ingress-redirect.yaml

# latest 같은 움직이는 태그를 쓰지 않는다. 무엇이 떠 있는지 알 수 없게 되고 되돌릴 수도 없다.
# 아래 값은 일부러 없는 태그로 두었다. 바꾸지 않고 배포하면 이미지를 받지 못해 바로 드러난다.
#   make -C deploy prod-set-tag TAG=<태그>
images:
  - name: naeil-server
    newName: ghcr.io/sirin-interact/tmrlife-server
    newTag: CHANGE-ME
  - name: naeil-web
    newName: ghcr.io/sirin-interact/tmrlife-web
    newTag: CHANGE-ME

replicas:
  - name: naeil-server
    count: 2
  - name: naeil-web
    count: 2

configMapGenerator:
  - name: naeil-config
    behavior: merge
    literals:
      # 호스트 부분은 아래 replacements가 params.yaml의 값으로 바꾼다.
      - PUBLIC_ORIGIN=https://app.example.com
      # Traefik 파드가 서버에 붙을 때 쓰는 주소 범위다. K3s의 기본 파드 대역이다.
      # --cluster-cidr를 바꿔 설치했다면 그 값으로 고친다. 확인: kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
      # 이 값이 맞아도 Traefik이 클라이언트의 주소를 받지 못하면 소용이 없다. deploy/README.md의 "클라이언트 주소"를 본다.
      - TRUSTED_PROXIES=10.42.0.0/16
      # DB가 만들어 주는 접속 주소에는 sslmode가 없다. 접속 라이브러리가 이 환경 변수를 기본값으로 읽는다.
      # 클러스터 안의 통신이라도 기록이 오가는 길이므로 TLS 없이는 붙지 않게 한다.
      - PGSSLMODE=require

patches:
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: naeil

# params.yaml의 값을 필요한 자리마다 옮겨 적는다. 도메인을 여섯 군데에서 따로 고치다가 하나를 빠뜨리는 일을 막는다.
replacements:
  - source:
      kind: ConfigMap
      name: naeil-deploy-params
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: naeil
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: Ingress
          name: naeil-http-redirect
        fieldPaths:
          - spec.rules.0.host
      - select:
          kind: Certificate
          name: naeil-tls
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: ConfigMap
          name: naeil-config
        fieldPaths:
          - data.PUBLIC_ORIGIN
        options:
          # "https://<호스트>"에서 // 뒤쪽만 바꾼다.
          delimiter: "//"
          index: 1
  - source:
      kind: ConfigMap
      name: naeil-deploy-params
      fieldPath: data.clusterIssuer
    targets:
      - select:
          kind: Certificate
          name: naeil-tls
        fieldPaths:
          - spec.issuerRef.name
