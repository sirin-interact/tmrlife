# 예시다. kustomization.yaml의 resources에 들어 있지 않고, 이 파일을 그대로 적용하지도 않는다.
# 실제 값이 담긴 Secret은 저장소에 올리지 않는다. 클러스터에 직접 만든다.
#
# 파일을 거치지 않고 만드는 법 (값이 셸 기록에 남지 않게 환경 변수로 넘긴다):
#
#   kubectl -n naeil create secret generic naeil-secrets \
#     --from-literal=DATA_KEK_V1="$DATA_KEK_V1" \
#     --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
#     --from-literal=SONIOX_API_KEY="$SONIOX_API_KEY" \
#     --from-literal=ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY"
#
# 서버와 작업자는 이 Secret의 키를 모두 환경 변수로 받는다(envFrom).
# 비밀이 아닌 설정(시도 한도, 세션 수명, 믿는 프록시 범위 등)은 여기에 넣지 않는다. kustomization.yaml의 naeil-config에 둔다.
# 같은 이름이 양쪽에 있으면 Secret의 값이 이겨서, 설정을 고쳐도 적용되지 않는 것처럼 보인다.
apiVersion: v1
kind: Secret
metadata:
  name: naeil-secrets
type: Opaque
stringData:
  # 마스터 키. 32바이트를 base64로 적는다. 만드는 법: openssl rand -base64 32
  # 이 키를 잃으면 저장된 기록을 영영 풀 수 없다. 클러스터 밖의 안전한 곳에 따로 보관한다.
  # 키를 바꿀 때는 DATA_KEK_V2를 더하고 설정의 DATA_KEK_ACTIVE를 2로 올린다. 옛 키는 지우지 않는다.
  DATA_KEK_V1: REPLACE_ME_WITH_OUTPUT_OF_openssl_rand_base64_32
  # 대화, 위기 판별, 일기 초안, 신호 추출에 쓴다. 설정의 AI_PROVIDER가 gemini(운영의 값)면 반드시 있어야 하고,
  # 없으면 서버와 작업자가 뜨지 않는다.
  GEMINI_API_KEY: REPLACE_ME
  SONIOX_API_KEY: REPLACE_ME
  ELEVENLABS_API_KEY: REPLACE_ME
---
# PostgreSQL 접속 주소. 서버, 작업자, 마이그레이션이 키 uri를 DATABASE_URL로 받는다.
# CloudNativePG로 naeil-db라는 DB를 띄우면 CloudNativePG가 같은 이름과 같은 키로 이 Secret을 만들어 준다. 그때는 직접 만들지 않는다.
# 다른 방식으로 띄운 DB를 쓸 때만 직접 만든다.
apiVersion: v1
kind: Secret
metadata:
  name: naeil-db-app
type: Opaque
stringData:
  uri: postgres://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require
