# API 서버. REST(/api)와 WebSocket(/ws)을 받는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naeil-server
  labels:
    app.kubernetes.io/name: naeil-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: naeil-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드가 준비된 뒤에 옛 파드를 내린다. 복제본이 하나여도 배포 중에 끊기지 않는다.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naeil-server
        app.kubernetes.io/component: server
    spec:
      # 쿠버네티스 API를 부르지 않으므로 토큰을 넣지 않는다.
      automountServiceAccountToken: false
      # 같은 네임스페이스의 서비스 주소가 환경 변수로 끼어들지 않게 한다. 설정은 환경 변수로만 읽는다.
      enableServiceLinks: false
      # preStop 5초 + 처리 중인 요청을 기다리는 20초 + 여유.
      # 이 값이 서버의 대기 시간보다 짧으면 요청을 마치기 전에 강제로 죽는다.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # 노드가 여럿이면 복제본을 흩어 놓는다. 노드가 하나뿐이어도 배치를 막지는 않는다.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: naeil-server
      initContainers:
        # 서버가 뜨기 전에 스키마를 끝까지 올린다. 이 이미지가 요구하는 스키마 없이 요청을 받는 일이 없게 한다.
        # 어떤 경로로 파드가 뜨든(배포, 재시작, 노드 이동, 복제본 늘리기) 같은 보장이 적용된다.
        # 여러 파드가 동시에 돌려도 안전하다. DB 잠금으로 한 번에 하나만 들어가고, 나머지는 기다렸다가 할 일이 없음을 확인하고 끝난다.
        - name: migrate
          image: naeil-server
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up"]
          env:
            # 스키마만 고치는 단계라 접속 주소만 넘긴다. 마스터 키와 API 키는 주지 않는다.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: naeil-db-app
                  key: uri
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: naeil-config
                  key: LOG_LEVEL
            # 접속 주소에 sslmode가 없는 환경에서는 설정의 PGSSLMODE가 TLS를 요구한다. 서버와 작업자는 설정을 통째로 받아서
            # 그 값을 보지만, 접속 주소만 받는 이 단계는 따로 넘겨주지 않으면 접속 라이브러리의 느슨한 기본값으로 붙는다.
            # 설정에 이 키가 없는 환경에서는 아무것도 넘기지 않는다.
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: naeil-config
                  key: PGSSLMODE
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: server
          image: naeil-server
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: naeil-config
            - secretRef:
                name: naeil-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: naeil-db-app
                  key: uri
            # 메모리 상한에 닿기 전에 GC가 먼저 일하게 한다. 아래 limits.memory의 90%쯤으로 맞춘다.
            - name: GOMEMLIMIT
              value: 460MiB
          # 뜨는 동안에는 이 검사만 돈다. 최대 60초까지 기다려 준다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # DB를 보지 않는다. DB가 내려갔다고 서버를 다시 띄워 봐야 나아지지 않는다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # DB에 닿지 않으면 트래픽에서 뺀다. 서버 쪽 확인이 2초까지 걸리므로 그보다 길게 기다린다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # 파드가 내려간다는 사실이 인그레스에 퍼지는 데 몇 초가 걸린다.
              # 그 사이에 서버가 먼저 문을 닫으면 아직 이쪽으로 오던 요청이 실패한다. 잠깐 기다린 뒤 종료 신호를 받는다.
              # 이미지에 셸이 없어 쿠버네티스가 직접 기다려 주는 방식을 쓴다.
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: naeil-server
  labels:
    app.kubernetes.io/name: naeil-server
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: naeil-server
  ports:
    - name: http
      port: 8080
      targetPort: http
