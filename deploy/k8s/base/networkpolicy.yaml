# DB에는 서버, 작업자, 마이그레이션만 닿을 수 있다. 웹 파드를 비롯한 나머지는 막힌다.
#
# DB 파드는 overlay가 만든다. 어떤 방식으로 띄우든 아래 두 레이블을 붙여야 이 정책이 적용된다.
# 레이블이 빠지면 정책이 아무 파드도 고르지 못해 DB가 열린 채로 남는다.
#
# 정책을 실제로 집행하는 것은 클러스터의 네트워크 구성이다. K3s는 기본으로 집행한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: naeil-db-clients
  labels:
    app.kubernetes.io/name: naeil-db-clients
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: naeil
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: naeil
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: ["server", "worker", "migrate"]
      ports:
        - protocol: TCP
          port: 5432
