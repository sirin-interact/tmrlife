# 작업자. 대화가 끝난 뒤의 일을 큐에서 꺼내 실행한다. 밖에서 들어오는 요청은 받지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naeil-worker
  labels:
    app.kubernetes.io/name: naeil-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: naeil-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 작업자가 뜬 뒤에 옛 작업자를 내린다. 잠깐 둘이 함께 돌아도 큐가 작업을 하나씩만 나눠 준다.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: naeil-worker
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # 돌던 작업을 기다리는 20초 + 남은 작업을 취소하고 정리하는 시간.
      # 끝내지 못한 작업은 큐가 나중에 다시 시도한다.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 큐 테이블이 없으면 작업자는 뜨자마자 죽는다. 서버와 같은 이유로 먼저 스키마를 올린다.
        - name: migrate
          image: naeil-server
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: naeil-db-app
                  key: uri
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: naeil-config
                  key: LOG_LEVEL
            # 접속 주소에 sslmode가 없는 환경에서는 설정의 PGSSLMODE가 TLS를 요구한다. 서버와 작업자는 설정을 통째로 받아서
            # 그 값을 보지만, 접속 주소만 받는 이 단계는 따로 넘겨주지 않으면 접속 라이브러리의 느슨한 기본값으로 붙는다.
            # 설정에 이 키가 없는 환경에서는 아무것도 넘기지 않는다.
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: naeil-config
                  key: PGSSLMODE
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: naeil-server
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          ports:
            # 상태 확인 전용이다. 밖에서 받을 요청이 없으므로 Service를 만들지 않는다. kubelet만 파드 주소로 부른다.
            # 번호는 naeil-config의 WORKER_HEALTH_ADDR와 같아야 한다.
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: naeil-config
            - secretRef:
                name: naeil-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: naeil-db-app
                  key: uri
            - name: GOMEMLIMIT
              value: 460MiB
          # 세 검사 모두 "큐가 돌고 있는가"를 묻는다. 큐가 DB에 붙어 돌기 시작해야 200이 된다.
          # DB는 보지 않는다. DB가 내려갔다고 작업자를 다시 띄워 봐야 나아지지 않고, 큐가 스스로 다시 붙는다.
          #
          # 뜨는 동안에는 이 검사만 돈다. 최대 60초까지 기다려 준다.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          # 프로세스가 떠 있는데 답이 없으면 멈춘 것이다. 다시 띄운다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 작업자로 가는 트래픽은 없다. 이 검사는 배포를 위한 것이다.
          # 새 작업자가 큐에 붙은 것을 확인한 뒤에만 옛 작업자를 내린다(maxUnavailable: 0).
          # 이 검사가 없으면 새 작업자가 설정 오류로 뜨자마자 죽어도 옛 작업자가 먼저 내려가 큐가 멈춘다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
