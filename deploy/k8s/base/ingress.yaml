# 웹앱과 API를 한 출처로 묶는다. 출처가 같아야 세션 쿠키가 단순해지고 CORS가 필요 없다.
# 호스트와 TLS는 overlay가 붙인다.
#
# WebSocket과 Traefik:
#   - 따로 켤 것은 없다. Traefik은 WebSocket 업그레이드를 알아서 처리한다.
#   - 긴 대화가 늘 비슷한 시간에 끊긴다면 두 곳을 본다. 하나는 Traefik 진입점의 시간 제한(respondingTimeouts)이다.
#     v3에서는 요청을 읽는 제한의 기본값이 60초다. K3s에서는 kube-system의 HelmChartConfig로 Traefik 설정을 바꾼다.
#     다른 하나는 Traefik 앞에 있는 장비다. 클라우드 로드 밸런서나 CDN은 조용한 연결을 보통 60~100초에 끊는다.
#   - 어느 쪽이든 대화 연결은 그보다 짧은 간격으로 ping을 주고받아 조용한 구간을 없애는 것이 안전하다.
#   - Traefik이 다시 뜨면 연결이 모두 끊긴다. 클라이언트는 다시 붙을 수 있어야 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: naeil
  labels:
    app.kubernetes.io/name: naeil
    app.kubernetes.io/component: ingress
spec:
  # K3s에 기본으로 들어 있는 인그레스 컨트롤러다.
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: naeil-server
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: naeil-server
                port:
                  name: http
          # 바깥의 가동 확인 도구가 볼 수 있게 생존 확인만 연다. DB 상태를 드러내는 /readyz는 열지 않는다.
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: naeil-server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: naeil-web
                port:
                  name: http
